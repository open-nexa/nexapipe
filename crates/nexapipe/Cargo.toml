[package]
name = 'nexapipe'
version.workspace = true
edition = '2024'
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { version = '4.6.1', features = ['derive'] }
iroh.workspace = true
iroh-tickets.workspace = true
quinn.workspace = true
rand = '0.10.1'
tokio.workspace = true
tracing = '0.1.44'
tracing-subscriber = { version = '0.3.23', features = ['env-filter', 'registry', 'chrono'] }
anyhow.workspace = true
http.workspace = true
url.workspace = true
toml = '1.1.2'
# Format-preserving TOML editing, so `--generate-2fa` can write a secret into
# config.toml without rewriting the file a human wrote.
toml_edit = '0.25'
serde = { version = '1.0.228', features = ['derive'] }
serde_json = '1.0'
# iroh's QUIC handshake needs a process-wide rustls CryptoProvider; see main.rs.
rustls.workspace = true
chrono = { version = '0.4.45', features = ['serde'] }
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
# TLS towards the backends: a route may name an `https://` backend, and this
# is the client side of that handshake. `ring` rather than the default
# `aws-lc-rs`, because the workspace's `rustls` already asks for `ring` and the
# process installs that one provider for the iroh handshake as well.
hyper-rustls = { version = "0.27.10", default-features = false, features = [
    "ring",
    "http1",
    "http2",
    "tls12",
] }
# The trust store a backend's certificate is checked against: the machine's own
# roots, with Mozilla's bundled ones as the fallback for a host that has none.
rustls-native-certs = "0.8.4"
webpki-roots = "1.0.9"
# Reading the CA file an operator names: the PEM parser that goes with the
# `rustls` above.
rustls-pemfile = "0.3"
# A WebSocket is a raw connection for the whole session, so it cannot go
# through the pooled HTTP client: this is the client-side TLS handshake for an
# `https://` backend on that path.
tokio-rustls = "0.26"
tokio-stream.workspace = true
flate2 = '1.0'
bytes.workspace = true
hex = '0.4'
nexapipe-client = { path = '../nexapipe-client', features = ['local-proxy'] }
nexapipe-proto.workspace = true
# 2FA support
# `zeroize` so the TOTP validator wipes its own copy of the seed when it is
# dropped: the validator is built from the secret, and without this it kept a
# second copy of the credential in the heap for as long as the process lived.
totp-rs = { version = '6.0', features = ['gen_secret', 'zeroize'] }
# The same crate, for the copies of a config the TOML parsers make on the way
# to the typed values: the file can hold the seeds in the clear, and those
# copies are wiped when they go out of scope. See `toml_zeroize`.
zeroize.workspace = true
base32 = '0.5'
# Challenge binding: AUTH_RESPONSE is signed HMAC-SHA256(secret, nonce||timestamp).
hmac = '0.13'
sha2 = '0.11'
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
# Spawns the built binary in the integration tests (see tests/).
duct = '1.1.1'
# `start_paused`, so the read timeouts are tested without waiting them out.
tokio = { workspace = true, features = ['test-util'] }
rqrr = { version = "0.11", default-features = false }
tempfile = '3.8'
# A certificate authority and a server certificate of our own, so the tests
# can run a backend that speaks TLS without shipping a key in the repository.
rcgen = "0.13"
# The benchmarks; see docs/benchmarks.md.
criterion = { workspace = true }

[[bench]]
name = "l4_forward"
harness = false
