# Gitleaks configuration.
#
# Gitleaks finds this file on its own — the action passes no `--config` — and
# a config that is given replaces the built-in rules. `[extend]` below is what
# keeps them: without it this file was the whole of the rule set, and since it
# only names allow-listed findings, the scan ran no rules at all and could not
# have failed. Then, and only then, the allowlist is what turns the scan into a
# gate: anything not named here fails the job.
title = "NexaPipe"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures that look like credentials"

regexes = [
    # `token_comparison_only_accepts_an_exact_match`
    # (crates/nexapipe/src/conn/mod.rs) feeds a constant to the constant-time
    # comparison and asserts on the boundaries. The constant has to be a real
    # string of bytes, and calling it a secret is the point of the test.
    '''^0123456789abcdef$''',

    # `config_with_one_device` (crates/nexapipe/src/auth/totp.rs) gives the
    # enrolled device a secret of its own, which is what the lookup is then
    # shown to answer with: signed under the device's name, the client's own
    # secret is a mismatch rather than a fallback. The fixture has to be a real
    # Base32 string of 160 bits — `totp-rs` will not build a validator from
    # anything shorter than 128 bits, and these tests do reach the TOTP check —
    # and a string that long and that evenly distributed is over the
    # `generic-api-key` entropy threshold, so the scanner reads it as a
    # credential. It is a fixture: it appears only in this test module.
    '''^KRSXG5BAMFRGGZDFMZTWQ2LKNNWG23TP$''',

    # `a_websocket_reaches_an_https_backend_over_tls`
    # (crates/nexapipe/tests/data_plane.rs) sends the RFC 6455 example
    # `Sec-WebSocket-Key` in its upgrade request. It is a protocol fixture, not
    # a credential: the test backend reads the request and answers `101`
    # without validating the nonce, and the value is the one published in the
    # RFC.
    '''^dGhlIHNhbXBsZSBub25jZQ==$''',

    # `an_enrollment_over_an_unspent_token_is_a_conflict`
    # (ui-android/app/src/test/java/com/nexa/pipe/ui/InviteConflictsTest.kt)
    # gave an invite a sequential hex token to compare against. It is a
    # placeholder in a test that never sends one anywhere, not a credential.
    # It no longer appears in the tree — a later commit replaced it — but this
    # branch's history still carries it, and the scan reads the commits a pull
    # request adds as well as the tree it ends at.
    '''^fedcba9876543210$''',
]
