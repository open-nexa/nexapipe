[package]
name = "nexa"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "nexa"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# Gives the UI the OS name (macOS drives traffic-light padding, Linux hides the custom window
# buttons). The alternative would be sniffing the user agent, which is exactly what the refactor
# plan rules out; this is the official, typed route and adds no command surface.
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1"
url = "2"
http = "1"
bytes = "1"
lazy_static = "1.4"
parking_lot = "0.12"
fastrand = "2"
# The IPC token is the only thing standing between an elevated service and any
# local process, so it is drawn from the OS CSPRNG rather than `fastrand` —
# which is a fast non-cryptographic generator seeded from time and ASLR.
getrandom = "0.3"
# The IPC handshake answers a challenge with HMAC-SHA256(token, nonces) instead
# of sending the token, so both sides prove they hold it without revealing it.
hmac = "0.13"
sha2 = "0.11"
# Credentials (TOTP secrets, enrollment tokens, relay bearers) are encrypted at
# rest with AES-256-GCM under a master key the OS keychain holds.
aes-gcm = "0.10"
# Every platform gets a real backend, because without one keyring falls back to a
# credential store that is only as private as the filesystem: `linux-native` on
# its own is the kernel keyring, which does not survive a reboot, so Linux takes
# the persistent Secret Service half as well. That half is the only reason the
# Linux build needs `libdbus-1-dev` (see the desktop jobs in ci.yml and
# release.yml); `sync` rather than `async` because nothing here is on an async
# path and the async half would pull a runtime into the credential store.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "linux-native-sync-persistent",
] }
# The master key is wiped when it goes out of scope rather than left in freed memory.
zeroize = "1"
tun = { version = "0.8", features = ["async"] }
libc = "0.2"
nexapipe-client = { path = "../../crates/nexapipe-client", features = [
    "local-proxy",
    "tun-proxy",
] }

# The credential door (src/gate.rs) asks the operating system who is at the
# keyboard. Each of these is already built for its platform as part of something
# else — `security-framework` by `keyring`'s macOS backend, `windows` (0.62) and
# `windows-future` by iroh's `netwatch` — so naming them here adds an edge to the
# graph and no code to the build. Only PAM is new, and only to Linux.
[target.'cfg(target_os = "macos")'.dependencies]
# Authorization Services: asking the Security Server for a right is what puts
# the system's own sheet on the screen, which is the prompt this platform
# brings. The `-sys` crate is named alongside it because the safe wrapper does
# not expose the status codes, and "the user dismissed the sheet" is worth
# telling apart from "there was nowhere to put one".
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux has no system prompt of its own to borrow, so the question goes to PAM.
# `cli` is off: it exists to read a password off a terminal, and this is a
# desktop app. Builds against `libpam0g-dev` (see the Linux jobs in ci.yml and
# release.yml).
pam-client2 = { version = "0.5", default-features = false }
# Only for `getpwuid(geteuid())`: the account to authenticate has to come from
# the process, not from `USER`, which whoever launched the app decided.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows Hello, with `LogonUserW` for the machines that have none.
windows = { version = "0.62", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    # `OpenProcessToken` / `GetCurrentProcess`, which is how the account to
    # authenticate is read off the process token instead of the environment.
    "Win32_System_Threading",
] }
# Hello is a WinRT API, so its answers arrive asynchronously; this is how one is
# waited out. The version pair `windows` 0.62 generates its bindings against.
windows-future = "0.3"

windows-service = "0.5"
# Only for the TUN address: `netsh` silently does nothing when this runs as a service
# (LocalSystem), which is the same class of failure as `net session` — see proxy/routing.rs.
windows-sys = { version = "0.61", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
] }

[[bin]]
name = "nexa-service"
path = "src/bin/nexa-service.rs"
