# cargo-audit configuration for the desktop app.
#
# CI does not run `cargo audit` here any more: the desktop tree is checked
# with `cargo deny`, which reads deny.toml at the root and ignores the same
# advisories. This file is what a local `cargo audit` run in this directory
# reads, so the entries below are the ones deny.toml ignores — the two lists
# have to agree, or a local run and the CI check disagree about the same
# lockfile.
#
# Vulnerabilities fail the run, informational advisories
# (unmaintained/unsound/yanked) stay warnings.

[advisories]
ignore = [
    # RUSTSEC-2026-0367/0368/0369, RUSTSEC-2026-0429, RUSTSEC-2026-0545 and
    # RUSTSEC-2026-0548: symlink, SUID/SGID, abort-on-symlink, missing
    # AES-authentication and local-header/central-directory parsing flaws in
    # `zip`, fixed only in zip >= 9.0.0 (>= 9.0.5 for the last one). zip
    # enters this tree solely through tauri-plugin-updater, which pins
    # `zip ^4` (2.14.0 and even 3.0.0-alpha.3 still do), so the lockfile
    # cannot move to the patched line yet. Exposure is narrow in practice: the
    # updater only extracts archives served by our own release backend after
    # minisign signature verification. Remove these entries and bump the
    # lockfile as soon as a tauri-plugin-updater release allows zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0548",
    # RUSTSEC-2024-0429: unsoundness in the `Iterator` and
    # `DoubleEndedIterator` impls for `glib::VariantStrIter`, fixed only in
    # glib >= 0.20. glib reaches this tree through the GTK stack — gtk
    # 0.18.2, via tauri 2.12.1's tray-icon and webkit2gtk — and every
    # published tauri release pins `gtk ^0.18`, which pins `glib ^0.18`, so
    # the lockfile cannot move to the patched line without a tauri major
    # bump. Remove this entry and bump the lockfile as soon as a tauri
    # release allows glib >= 0.20.
    "RUSTSEC-2024-0429",
    # RUSTSEC-2026-0459: SQLite before 3.54.0 can return uninitialized
    # page-cache memory when a process opens a database file together with a
    # `-wal` sibling whose page size differs from the database's
    # (CVE-2026-119375). The advisory belongs to the server's tree — the
    # SQLite store is what pulls libsqlite3-sys in — and the fix landed in
    # libsqlite3-sys 0.39.0 (SQLite 3.54.0), a version sqlx-sqlite 0.9.0
    # cannot use because it pins `libsqlite3-sys >=0.30.1, <0.38.0`. It is
    # listed here so that this file and the one at the root stay in step.
    "RUSTSEC-2026-0459",
    # RUSTSEC-2026-0574..0582: nine unsoundness advisories on heapless
    # 0.7.17, all fixed in heapless >= 0.9.4. The 0.9.3 copy reached through
    # smoltcp is updated to 0.9.4; the 0.7.17 copy comes from postcard 1.x
    # (iroh-relay / iroh-tickets), which pins the 0.7 line, so that copy
    # cannot move until iroh moves off postcard 1.x. Listed so this file and
    # the one at the root stay in step. Remove these entries and bump the
    # lockfile as soon as an iroh release allows heapless >= 0.9.4.
    "RUSTSEC-2026-0574",
    "RUSTSEC-2026-0575",
    "RUSTSEC-2026-0576",
    "RUSTSEC-2026-0577",
    "RUSTSEC-2026-0578",
    "RUSTSEC-2026-0579",
    "RUSTSEC-2026-0580",
    "RUSTSEC-2026-0581",
    "RUSTSEC-2026-0582",
]
