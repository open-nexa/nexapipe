name: CI

# Fast checks for regular commits/PRs: rust formatting/lint/tests/feature
# combinations, the Android NDK cfg check, plus the desktop and Android app
# jobs that used to live in the open-nexa/nexa-desktop / nexa-android repos.
# Multi-platform builds are verified by release.yml when a tag is pushed.
#
# The container image is built here as well, without pushing: the Dockerfiles
# and the job that publishes them only ever run from a tag, so this is the one
# place a broken Dockerfile is caught before a release depends on it.
#
# The `test` job runs the root workspace on Linux and macOS. Windows is covered
# by `windows-test` below, which used to be `windows-check`, a `cargo check`:
# the integration tests spawn the built binary, and the cfg(unix) halves of the
# config watcher and of shutdown have no Windows counterpart to run them
# against. Those halves are `#[cfg(unix)]` gated rather than left to fail, so
# what a Windows run reports is the half that does exist, which is the half
# release.yml builds from a tag. A check only catches what stops compiling;
# anything that fails once it runs still reached a tag.
#
# Jobs that exist purely because the default feature set cannot see the code they cover:
#   - android-ndk: the fd-based entry point of crates/nexapipe-client/src/tun_proxy.rs is
#               cfg(target_os = "android"); a host check covers the shared stack but not
#               the Android half. Without this job a break there only surfaces when the
#               release APK is built from a tag.
#   - features: `local-proxy` / `webpki-roots` / `uniffi` change which optional
#               dependencies are compiled, so the combinations that matter are listed
#               explicitly instead of relying on --all-features.
#
# Desktop jobs (desktop-*): ui-desktop/src-tauri is excluded from the root cargo
# workspace and has its own Cargo.lock, so it needs its own check/clippy/test/audit
# jobs. The frontend job runs vue-tsc + vite + the i18n/token linters.
#
# Android app jobs (android-app / android-lint): gradle unit tests, debug build and
# lint. The Rust .so is deliberately NOT built here — JNI is loaded at runtime, and
# the Rust side is covered by the android-ndk job and by release.yml.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pin the toolchain here as the other jobs do. Without it this job would
      # use whatever rustfmt the runner image happens to ship, so a format change
      # in a new rustfmt release would fail a PR that touched no Rust at all.
      # `toolchain` is pinned alongside the action: its default is `stable`,
      # which moves, so an unpinned toolchain leaves the results of CI and of a
      # release build dependent on the calendar. Bump the two together.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Pin the toolchain, as the fmt job does. Clippy runs with -D warnings, so
      # a lint added by a new toolchain release turns this job red on a PR that
      # changed no Rust at all.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      # -D warnings: without this clippy exits 0 and the job is decorative.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS matters because development happens on one: a test that only
        # passes on the Linux runner is a test that breaks the maintainer's
        # machine. Architecture variants do not change which cfg branch runs,
        # so one runner per OS is enough.
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - name: cargo test
        run: cargo test --workspace --locked

  # The root workspace's only Windows coverage. release.yml does build Windows
  # binaries, but only from a tag, so this is what tells a PR that the crates
  # still work there — and `cargo test` is what tells it: the integration tests
  # are where the crates' public surface is used the way a caller uses it, and
  # compiling them without running them only ever caught half a break.
  windows-test:
    name: cargo test (windows-latest)
    runs-on: windows-latest
    # 60 rather than the 45 the other jobs use: a Windows runner compiles the
    # same dependency tree more slowly, and this one now links and runs as well.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 @ 2026-08-06
        with:
          key: windows-test
      # The same command the Linux and macOS runners run, so the three agree on
      # what "the tests pass" means. `--all-targets` is gone because `cargo
      # test` already compiles the test targets that used to be the reason for
      # it; there is no bench target in this workspace to add back.
      - name: cargo test
        run: cargo test --workspace --locked

  features:
    name: client features (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features:
          - "local-proxy"
          - "tun-proxy" # the shared smoltcp stack (host entry point)
          - "webpki-roots"
          - "uniffi"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.features }}
      - name: cargo check
        run: cargo check -p nexapipe-client --all-targets --features "${{ matrix.features }}" --locked
      # Compiling tests is not running them: the `tun-proxy` unit tests (DNS
      # cache semantics, virtual-IP allocation) sat green in the repo for a
      # release without ever executing on a runner, because the workspace test
      # job runs default features and this job only used to `check`.
      - name: cargo test
        run: cargo test -p nexapipe-client --features "${{ matrix.features }}" --locked

  android-ndk:
    name: android ndk (tun-proxy / jni)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Android NDK
        id: ndk
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          NDK_DIR=$(ls -1d "$SDK"/ndk/*/ 2>/dev/null | sort -V | tail -n 1 | sed 's:/$::' || true)
          if [ -z "${NDK_DIR:-}" ]; then
            SM=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)
            [ -n "${SM:-}" ] || { echo "::error::no sdkmanager and no NDK under $SDK"; exit 1; }
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "ndk;29.0.14206865" \
              || echo "::warning::pinned NDK unavailable, falling back to whatever is in the image"
            NDK_DIR=$(ls -1d "$SDK"/ndk/*/ 2>/dev/null | sort -V | tail -n 1 | sed 's:/$::' || true)
          fi
          [ -n "${NDK_DIR:-}" ] || { echo "::error::no NDK available"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK: $NDK_DIR"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-check

      # Both shipped ABIs are type-checked, not just the one that used to be the
      # only one: a change that compiles for aarch64 and not for x86_64 is a
      # change that breaks the emulator build at release time.
      #
      # The repo .cargo/config.toml hardcodes a Windows NDK linker path; --config
      # takes precedence over both env vars and the config file.
      - name: cargo ndk check (jni + local-proxy + tun-proxy)
        run: |
          set -euo pipefail
          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for PAIR in "arm64-v8a:aarch64-linux-android" "x86_64:x86_64-linux-android"; do
            ABI="${PAIR%%:*}"
            TRIPLE="${PAIR##*:}"
            LINKER="${NDK_BIN}/${TRIPLE}26-clang"
            cargo ndk --target "${ABI}" --platform 26 check \
              -p nexapipe-client \
              --features "jni local-proxy tun-proxy" \
              --config "target.${TRIPLE}.linker='${LINKER}'"
          done

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RUSTSEC advisories for everything in Cargo.lock. Unmaintained/unsound
      # advisories are informational (exit 0); vulnerabilities fail the job.
      - name: cargo audit
        run: cargo audit

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Free for public repositories. If a repo ever becomes private, add
      # GITLEAKS_LICENSE (orgs need a paid licence) as a secret.
      #
      # Scans the whole history, so a finding cannot be undone by deleting the
      # line: it has to be named in `.gitleaks.toml` instead. That file lists
      # the test fixtures that look like credentials and nothing else, which is
      # what lets this run as a gate.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          # glib 0.18 rides in with the gtk 0.18 stack tauri pulls in on Linux
          # (tao, muda and webkit2gtk all still require gtk ^0.18), and this
          # advisory is only patched in glib >= 0.20, so there is no version to
          # move to until upstream tauri migrates. Nothing in this workspace
          # touches glib::VariantStrIter, the unsound iterator it describes.
          #
          # Drop this once ui-desktop/src-tauri/Cargo.lock pins glib >= 0.20.
          allow-ghsas: GHSA-wrw7-89jp-8q8g

  # ------------------------------------------------------------------
  # Desktop app (migrated from open-nexa/nexa-desktop; src-tauri depends on
  # ../../crates/nexapipe-client of this same repository).
  # ------------------------------------------------------------------

  desktop-frontend:
    name: desktop frontend (typecheck + build + linters)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ui-desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ui-desktop/.nvmrc
          cache: npm
          cache-dependency-path: ui-desktop/package-lock.json

      # npm ci, not npm install: it fails outright when package-lock.json and package.json disagree.
      - name: npm ci
        run: npm ci

      # vue-tsc --noEmit && vite build
      - name: typecheck + build
        run: npm run build

      - name: lint i18n
        run: npm run lint:i18n

      - name: lint design tokens
        run: npm run lint:tokens

  desktop-check:
    name: desktop cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-15
          - os: windows-latest

    defaults:
      run:
        working-directory: ui-desktop

    steps:
      - uses: actions/checkout@v7

      # Catch cross-platform compile breakage early: development happens on one machine, so anything inside
      # #[cfg(target_os = "linux"/"macos"/"windows")] is never compiled locally (the `?` on bool / PathBuf
      # not in scope bug in platform.rs slipped out exactly that way). Architecture variants do not change
      # which cfg branch runs, so one amd64 runner per OS covers every cfg branch.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        # Two build-only dependencies of the desktop crate on Linux:
        #   - libdbus-1-dev, what keyring's persistent backend builds against
        #     (Secret Service); without it the crate does not compile.
        #   - libpam0g-dev, what the credential door builds against: Linux has
        #     no system prompt of its own to borrow, so it asks PAM.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            libdbus-1-dev \
            libpam0g-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: 1.98.1

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ui-desktop/src-tauri -> target

      # --all-targets matters: daemonize in src/bin/nexa-service.rs (#[cfg(unix)]) lives only in the bin
      # target and is not checked without it.
      - name: cargo check --all-targets
        shell: bash
        working-directory: ui-desktop/src-tauri
        run: cargo check --all-targets

  desktop-rust:
    name: desktop rust (clippy + tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    defaults:
      run:
        working-directory: ui-desktop

    steps:
      - uses: actions/checkout@v7

      # The same two as the Linux half of desktop-check: this job runs clippy and
      # the tests, which compile the whole crate and not just type-check it, so
      # it needs every build-time dependency the desktop crate has on Linux.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            libdbus-1-dev \
            libpam0g-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ui-desktop/src-tauri -> target

      # clippy already runs with -D warnings: new code may not paper over a lint with #[allow]; warnings must be zero.
      - name: cargo clippy --all-targets
        working-directory: ui-desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --lib
        working-directory: ui-desktop/src-tauri
        run: cargo test --lib

  desktop-audit:
    name: desktop dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ui-desktop

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: 1.98.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # src-tauri has its own Cargo.lock (excluded from the root workspace), so the audit job at the repo
      # root never sees it.
      - name: cargo audit
        working-directory: ui-desktop/src-tauri
        run: cargo audit

      - uses: actions/setup-node@v7
        with:
          node-version-file: ui-desktop/.nvmrc
          cache: npm
          cache-dependency-path: ui-desktop/package-lock.json

      - name: npm audit
        working-directory: ui-desktop
        # Runtime dependencies only (--omit=dev), and only high/critical fail the build: upgrading a moderate
        # advisory deep in the build chain costs far more than it is worth; dependabot can follow those slowly.
        run: npm audit --omit=dev --audit-level=high

  # ------------------------------------------------------------------
  # Android app (migrated from open-nexa/nexa-android).
  # ------------------------------------------------------------------

  android-app:
    name: android app (unit tests + debug build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ui-android

    env:
      # compileSdk 37 (Compose 1.12 requires it); note the platform package is
      # named android-37.0 — plain "android-37" no longer exists upstream.
      ANDROID_PLATFORM: '37.0'
      BUILD_TOOLS: 37.0.0

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        # Not android-actions/setup-android: it installs "tools" by default, a package that has been pulled
        # from the SDK repository and fails outright on current images.
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          fi
          [ -x "${SM:-}" ] || { echo "::error::sdkmanager not found under $SDK/cmdline-tools"; exit 1; }

          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}"

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-report
          # upload-artifact paths are relative to the workspace root and ignore defaults.run.
          path: ui-android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: assembleDebug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-app-debug-apk
          path: ui-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-lint:
    name: android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ui-android

    env:
      # compileSdk 37 (Compose 1.12 requires it); note the platform package is
      # named android-37.0 — plain "android-37" no longer exists upstream.
      ANDROID_PLATFORM: '37.0'
      BUILD_TOOLS: 37.0.0

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          fi
          [ -x "${SM:-}" ] || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}"

      # Gating, not observing: `app/lint-baseline.xml` records what lint reports
      # today, and `warningsAsErrors` in app/build.gradle.kts is what makes the
      # job care — Android lint reports most of what it finds (unused resources,
      # a newer library, a resource read outside a composable scope) as a
      # warning, which `abortOnError` passes. So a red job here means a *new*
      # finding, error or warning alike. Fixing a recorded one means refreshing
      # the baseline with `./gradlew :app:updateLintBaseline` in the same change
      # — and doing that periodically is worth it on its own, because an entry
      # whose check no longer fires is a problem the file claims is still there.
      - name: lintDebug
        id: lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: |
            ui-android/app/build/reports/lint-results-debug.html
            ui-android/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Container image, build only: the mirror of the build-image job in
  # release.yml with the push taken out. Same Dockerfiles, same runners,
  # same platform list — only `push: false` differs, and no manifest is
  # assembled, because there is nothing to publish.
  # ------------------------------------------------------------------
  build-image:
    name: image ${{ matrix.arch }} (build only)
    # Pull requests only: this is the check that runs before a tag exists. A
    # push to main is already followed by the tag build that publishes the
    # image, so building twice there only spends runner minutes.
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            # Native arm64 runner: Dockerfile compiles for the host triple, so
            # an arm64 image needs an arm64 CPU (or QEMU over the whole build).
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 @ 2025-12-16

      # No docker/login-action: nothing is pushed, so no credentials are asked
      # for — a pull request from a fork gets none either way.

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 @ 2026-02-12
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          # --load so the result can be started below instead of only compiled;
          # provenance is off because an attestation manifest cannot be loaded
          # into the local daemon.
          provenance: false
          load: true
          tags: nexapipe:ci-${{ matrix.arch }}

      # Compiling is not running: ENTRYPOINT is the binary itself, so --version
      # is one process start in the image that a user would pull.
      - name: Smoke test
        run: docker run --rm "nexapipe:ci-${{ matrix.arch }}" --version

