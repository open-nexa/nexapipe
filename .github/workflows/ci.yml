name: CI

# 尽早发现跨平台编译问题：本地是 Windows，#[cfg(target_os = "linux"/"macos")]
# 里的代码在本地永远编不到，只能靠 CI 兜底。否则这类错误要等到推 tag 出 release
# 时才会暴露（platform.rs 的 `?` on bool / PathBuf not in scope 就是这么漏出去的）。
#
# 只跑 cargo check（编译期），不跑测试和打包，几个目标加起来几分钟内结束。
# 架构变体不影响 cfg 走向，所以每个 OS 用 amd64 runner 即可覆盖全部 cfg 分支。
#
# crates/ 从哪个仓库 / 哪个分支拉取由仓库变量覆盖（fork 上必须设，见 check job 里的注释）：
#   NEXAPIPE_REPO（默认 open-nexa/nexapipe）、NEXAPIPE_REF（默认 main）。
#
# 另外两个 job 补的是之前完全没有的检查：
#   - frontend：vue-tsc 类型检查 + vite build + lint:i18n + lint:tokens。
#     新增错误码必须同时改 error.rs / errors.ts / 两份 locale，lint:i18n 是唯一
#     能抓到漏改的环节，之前只能靠人记得在本地跑。
#   - rust：src-tauri 里的 #[test]（error.rs / lib.rs / service/*）以前从来没在
#     CI 上跑过。
#
# clippy 已经带 -D warnings：11 条存量告警（too_many_arguments / new_without_default /
# large_enum_variant 等）已清完，其中 4 条 too_many_arguments 是抽参数结构体改掉的，
# 所以新代码不能靠 #[allow] 绕过，告警必须是零。
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (typecheck + build + linters)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ui-desktop

    steps:
      # 必须带 path：本仓库就是 ui-desktop 本身，不带 path 会 checkout 到
      # /home/runner/work/nexa-desktop/nexa-desktop（仓库根），于是
      # ui-desktop/.nvmrc 不存在，setup-node 直接报
      # "The specified node version file ... does not exist"，
      # 后面的 working-directory: ui-desktop 也会一起挂。
      # check / rust / audit 三个 job 都是这么写的，这里保持一致。
      - uses: actions/checkout@v5
        with:
          path: ui-desktop

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui-desktop/.nvmrc
          cache: npm
          cache-dependency-path: ui-desktop/package-lock.json

      # npm ci（不是 npm install）：package-lock.json 与 package.json 不一致时直接失败。
      - name: npm ci
        run: npm ci

      # vue-tsc --noEmit && vite build
      - name: typecheck + build
        run: npm run build

      - name: lint i18n
        run: npm run lint:i18n

      - name: lint design tokens
        run: npm run lint:tokens

  check:
    name: cargo check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-14
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # 与 release.yml 相同：src-tauri 依赖仓库外的 ../../crates/nexapipe-client，
        # 源码必须 checkout 到 ui-desktop/ 子目录，crates/ 铺到 workspace 根。
        working-directory: ui-desktop

    steps:
      - name: Checkout nexapipe-desktop
        uses: actions/checkout@v5
        with:
          path: ui-desktop

      - name: 拉取 path 依赖 (${{ vars.NEXAPIPE_REPO || 'open-nexa/nexapipe' }})
        # src-tauri 依赖 ../../crates/nexapipe-client，而 crates/ 不在本仓库里。
        #
        # 这里故意用匿名 clone，而不是 actions/checkout + github.token：GITHUB_TOKEN
        # 的作用域只有「触发工作流的那个仓库」，拿它去拉另一个仓库会直接失败
        # （表现就是 "The process '/usr/bin/git' failed with exit code 1"）。
        # open-nexa/nexapipe 是公开仓库，本来也不需要凭据；哪天它变成私有，
        # 只要配上 NEXAPIPE_REPO_TOKEN（有读权限的 PAT），下面会自动换成带认证的
        # 请求。（凭据走 http.extraheader，不拼进 URL，避免出错时把 PAT 打进日志。）
        #
        # 也不用 sparse-checkout：那会让 checkout 走 --filter=blob:none 的
        # partial clone，白白多一层不确定性，而整个仓库只有几 MB。
        shell: bash
        env:
          DEP_REPO: ${{ vars.NEXAPIPE_REPO || 'open-nexa/nexapipe' }}
          DEP_REF: ${{ vars.NEXAPIPE_REF || 'main' }}
          DEP_TOKEN: ${{ secrets.NEXAPIPE_REPO_TOKEN }}
        run: |
          set -eo pipefail
          if [[ ! "$DEP_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::NEXAPIPE_REPO 必须是 owner/repo 形式（当前值：$DEP_REPO）"
            exit 1
          fi
          git_args=()
          if [ -n "$DEP_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$DEP_TOKEN" | base64 | tr -d '\n')
            git_args=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth")
          fi
          git "${git_args[@]}" clone --depth 1 --branch "$DEP_REF" \
            "https://github.com/$DEP_REPO" "$GITHUB_WORKSPACE/nexapipe-deps"

      - name: Stage crates at workspace root
        shell: bash
        run: |
          set -eo pipefail
          src="$GITHUB_WORKSPACE/nexapipe-deps/crates"
          dst="$GITHUB_WORKSPACE/crates"
          case "$dst" in
            */crates) ;;
            *) echo "::error::意外的目标路径：$dst"; exit 1 ;;
          esac
          if [ ! -d "$src" ]; then
            echo "::error::在 $DEP_REPO@$DEP_REF 中找不到 crates/ 目录。"
            echo "Hint: 本仓库的改动依赖服务端 crates 的对应分支时，需要设置仓库变量 NEXAPIPE_REPO / NEXAPIPE_REF。"
            echo "--- $GITHUB_WORKSPACE ---"; ls -la "$GITHUB_WORKSPACE" || true
            exit 1
          fi
          rm -rf "$dst"
          cp -r "$src" "$dst"
          test -f "$dst/nexapipe-client/Cargo.toml"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ui-desktop/src-tauri -> target

      # --all-targets 很重要：src/bin/nexa-service.rs 里的 daemonize（#[cfg(unix)]）
      # 只在 bin target 里，不带上 --all-targets 就检查不到。
      - name: cargo check --all-targets
        shell: bash
        working-directory: ui-desktop/src-tauri
        run: cargo check --all-targets

  rust:
    name: rust (clippy + tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout nexapipe-desktop
        uses: actions/checkout@v5
        with:
          path: ui-desktop

      - name: 拉取 path 依赖 (${{ vars.NEXAPIPE_REPO || 'open-nexa/nexapipe' }})
        shell: bash
        env:
          DEP_REPO: ${{ vars.NEXAPIPE_REPO || 'open-nexa/nexapipe' }}
          DEP_REF: ${{ vars.NEXAPIPE_REF || 'main' }}
          DEP_TOKEN: ${{ secrets.NEXAPIPE_REPO_TOKEN }}
        run: |
          set -eo pipefail
          if [[ ! "$DEP_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::NEXAPIPE_REPO 必须是 owner/repo 形式（当前值：$DEP_REPO）"
            exit 1
          fi
          git_args=()
          if [ -n "$DEP_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$DEP_TOKEN" | base64 | tr -d '\n')
            git_args=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth")
          fi
          git "${git_args[@]}" clone --depth 1 --branch "$DEP_REF" \
            "https://github.com/$DEP_REPO" "$GITHUB_WORKSPACE/nexapipe-deps"

      - name: Stage crates at workspace root
        shell: bash
        run: |
          set -eo pipefail
          rm -rf "$GITHUB_WORKSPACE/crates"
          cp -r "$GITHUB_WORKSPACE/nexapipe-deps/crates" "$GITHUB_WORKSPACE/crates"
          test -f "$GITHUB_WORKSPACE/crates/nexapipe-client/Cargo.toml"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ui-desktop/src-tauri -> target

      - name: cargo clippy --all-targets
        working-directory: ui-desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --lib
        working-directory: ui-desktop/src-tauri
        run: cargo test --lib

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: ui-desktop

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: ui-desktop/src-tauri
        run: cargo audit

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui-desktop/.nvmrc
          cache: npm
          cache-dependency-path: ui-desktop/package-lock.json

      - name: npm audit
        working-directory: ui-desktop
        # 只看运行时依赖（--omit=dev），只拦 high/critical：构建链上的 moderate
        # 告警升级成本远高于收益，交给 dependabot 慢慢跟。
        run: npm audit --omit=dev --audit-level=high
