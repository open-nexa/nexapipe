name: Bug report
description: Something does not behave the way the README says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please search existing issues first — including
        closed ones — before opening a new one.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part is misbehaving?
      options:
        - Server (`crates/nexapipe`)
        - Client library (`crates/nexapipe-client`)
        - Wire format (`crates/nexapipe-proto`)
        - Android app (`ui-android`)
        - Desktop app (`ui-desktop`)
        - Website or documentation
        - Not sure
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Everything lives in this repository — the server crates, `ui-android/` and
        `ui-desktop/` — so app bugs are filed here too.

  - type: input
    id: version
    attributes:
      label: Version
      description: >
        Release tag, or the commit hash if you built from source. For the apps,
        the version shown in the app itself.
      placeholder: v0.3.0 / 96c9971
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: >
        Where it runs: OS and architecture for the server, device and Android
        version for the Android app, desktop OS for the desktop app.
      placeholder: Ubuntu 24.04 x86_64 / Android 16 on Pixel 8 / Windows 11 x86_64
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered, and short enough that someone else can follow it.
      placeholder: |
        1. Start the server with this config
        2. Open a stream with ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: |
        Required for a UI problem in the Android or desktop app. Crop out anything
        that shows an endpoint ID, an invite QR or a 2FA secret — this issue is
        public.
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant config (server)
      description: |
        Only the section that matters. Remove every 2FA secret, relay URL and
        Node ID first — this issue is public.
      render: toml
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Server: run with `debug = true` if you can. Query strings are redacted in
        the access log, but check the output anyway before pasting it. Android:
        `adb logcat`. Desktop: the log file in the app's data directory.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues
          required: true
        - label: I checked my config against the README section for this feature
          required: false
