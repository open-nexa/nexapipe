services:
  nexapipe:
    # Named so that a published image and a local build are the same thing to
    # `docker compose`: `up` uses the image when it is already here and builds
    # when it is not, and `--build` always builds and tags the result with this
    # name. Without it there was no image to pull — only ever a build to run.
    image: ghcr.io/open-nexa/nexapipe:latest
    build: .
    container_name: nexapipe
    restart: unless-stopped
    volumes:
      # The whole directory is mounted, not the file inside it. A single-file
      # bind mount is pinned to the inode the path had when the container
      # started, so anything that replaces the file — `sed -i`, an editor with
      # atomic save, `mv` — leaves the container reading the copy that was
      # swapped out, silently and forever. A directory mount is resolved by
      # name on every lookup, so it always sees the current file.
      #
      # Create it first: `mkdir -p config`, then
      # `cp config.toml.example config/config.toml`
      # (`config.toml` is gitignored: it is the operator's live config), or
      # `mv config.toml config/config.toml` for a deployment that already has
      # one. Start from `config.toml.2fa.example` instead for 2FA — and mind
      # its file mode, a config holding secrets is refused when it is not
      # `0600`. A missing directory makes Docker create an empty one and the
      # server then fails to read the file.
      #
      # Mounted read-write on purpose: the server writes the 2FA counters
      # (`failed_attempts`, `locked_until`, `last_used`) back into this file, so
      # a `:ro` mount costs a lockout its persistence and an error per attempt.
      - ./config:/app/config
      # Log files, written by the [log] section of config.toml.
      # `docker compose exec nexapipe tail -f /app/logs/nexapipe.log`
      - ./logs:/app/logs
    environment:
      # Directory inside the container that receives the log files. Overrides
      # [log] dir so the files always land in the mounted volume.
      - NEXAPIPE_LOG_DIR=/app/logs
      # Timestamps and rotated file names use local time.
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # stdout is still logged (that is what `docker logs` shows); cap it so the
    # json-file driver cannot grow without bound.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
