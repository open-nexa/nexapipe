services:
  nexapipe:
    # Named so that a published image and a local build are the same thing to
    # `docker compose`: `up` uses the image when it is already here and builds
    # when it is not, and `--build` always builds and tags the result with this
    # name. Without it there was no image to pull — only ever a build to run.
    image: ghcr.io/open-nexa/nexapipe:latest
    build: .
    container_name: nexapipe
    restart: unless-stopped
    volumes:
      # The whole directory is mounted, not the file inside it. A single-file
      # bind mount is pinned to the inode the path had when the container
      # started, so anything that replaces the file — `sed -i`, an editor with
      # atomic save, `mv` — leaves the container reading the copy that was
      # swapped out, silently and forever. A directory mount is resolved by
      # name on every lookup, so it always sees the current file.
      #
      # Create it first (with the other two mounts — see the ownership note
      # below): `mkdir -p config secrets logs`, then
      # `cp config.toml.example config/config.toml`
      # (`config.toml` is gitignored: it is the operator's live config), or
      # `mv config.toml config/config.toml` for a deployment that already has
      # one. Start from `config.toml.2fa.example` instead for 2FA — its file mode
      # is no longer checked, so a `0644` config starts. A missing directory
      # makes Docker create an empty one and the server then fails to read the
      # file.
      #
      # Mounted read-write on purpose: the server writes the 2FA counters
      # (`failed_attempts`, `locked_until`, `last_used`) back into this file, so
      # a `:ro` mount costs a lockout its persistence and an error per attempt.
      - ./config:/app/config
      # The endpoint identity lives here, not in config.toml: the env var below
      # points `secret_key_file` at `/app/secrets/iroh.key`, and the first start
      # generates the key into it (mode 0600). That keeps the credential out of
      # the file operators edit, copy and back up, and out of the config mount
      # entirely. Create it with the config directory above. Back the directory up
      # with the config — losing it means a new Node ID on the next start, and
      # clients that stored the old one stop finding the server. Do not commit
      # it.
      - ./secrets:/app/secrets
      # Log files, written by the [log] section of config.toml.
      # `docker compose exec nexapipe tail -f /app/logs/nexapipe.log`
      - ./logs:/app/logs
    # The image runs as uid 1000, not root, so all three mounts above must exist
    # and be writable by it. `mkdir` alone is not enough: the directories land
    # owned by whoever ran it, and on a host where that is not uid 1000 the
    # failures are quiet — an iroh key that cannot be written is replaced by an
    # ephemeral one (a new Node ID on every restart), and a config that cannot be
    # written loses the 2FA counters. On a fresh setup, after copying the config:
    #
    #     mkdir -p config secrets logs
    #     sudo chown -R 1000:1000 config secrets logs
    #
    # **Upgrading a deployment that ran the root image**: the files it wrote are
    # root-owned, and the new user cannot write them — the symptom is a start
    # that fails on `/app/config/config.toml`, or a *new* iroh key generated
    # because `/app/secrets/iroh.key` could not be opened, which changes the Node
    # ID every client has stored. Run the same `sudo chown` before the first
    # start; without `sudo` it cannot change files root owns.
    environment:
      # Directory inside the container that receives the log files. Overrides
      # [log] dir so the files always land in the mounted volume.
      - NEXAPIPE_LOG_DIR=/app/logs
      # The endpoint identity as a file path, read by [iroh] alongside
      # NEXAPIPE_IROH_SECRET_KEY and the config's own `secret_key` /
      # `secret_key_file` keys — naming the key by more than one of them is
      # refused, so leave those unset while this is set. A missing file is
      # generated here on first start; see the ./secrets mount above.
      - NEXAPIPE_IROH_SECRET_KEY_FILE=/app/secrets/iroh.key
      # Where the binary looks for the config by default. The bind mount above
      # puts `config.toml` at `/app/config/config.toml` inside the container;
      # setting this means `nexapipe` (no --config) picks it up. --config still
      # wins, so an operator can point at any path.
      - NEXAPIPE_CONFIG_DIR=/app/config
      # Timestamps and rotated file names use local time.
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # stdout is still logged (that is what `docker logs` shows); cap it so the
    # json-file driver cannot grow without bound.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
