name: CI

# PR / push 到主分支时跑的检查。在此之前 ui-android 只有 release-apk.yml
# （tag / 手动触发），也就是说 PR 上没有任何验证：
#   - app/src/test 下的 OtpAuthUriTest / provisioning 单测从来没在 CI 上跑过；
#   - Kotlin / Compose 代码只有等到打 tag 出 APK 才会被真正编译一次。
#
# 这里刻意不构建 Rust .so：libnexapipe_client.so 由 release-apk.yml 从上游仓库
# 交叉编译后注入，单元测试和 Kotlin 编译都不需要它（JNI 是运行时加载）。
# Rust 侧的改动由 open-nexa/nexapipe 自己的 ci.yml 覆盖（含 android cfg 检查）。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: '36'
  BUILD_TOOLS: 36.0.0

jobs:
  build:
    name: unit tests + debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        # 与 release-apk.yml 一样不用 android-actions/setup-android：它默认装
        # "tools"，这个包早已从 SDK 仓库下架，在新镜像上直接失败。
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          fi
          [ -x "${SM:-}" ] || { echo "::error::sdkmanager not found under $SDK/cmdline-tools"; exit 1; }

          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}"

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: assembleDebug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  lint:
    name: android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          fi
          [ -x "${SM:-}" ] || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}"

      # 先观察：存量告警（缺翻译、lint 默认规则）很多，等基线干净后去掉
      # continue-on-error 让它真正拦 PR。
      - name: lintDebug
        continue-on-error: true
        id: lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
